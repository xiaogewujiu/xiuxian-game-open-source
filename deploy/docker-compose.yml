services:
  api:
    build:
      context: .
      dockerfile: api.Dockerfile
    container_name: xiuxian-api
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Data Source=Data/game-dev.db;Cache=Shared
    ports:
      - "5247:8080"
    volumes:
      - ./api/Data:/app/Data
      - ./api/wwwroot/uploads:/app/wwwroot/uploads

  game:
    image: nginx:1.27-alpine
    container_name: xiuxian-game
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - ./game:/usr/share/nginx/html:ro
      - ./game.nginx.conf:/etc/nginx/conf.d/default.conf:ro

  admin:
    image: nginx:1.27-alpine
    container_name: xiuxian-admin
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5176:80"
    volumes:
      - ./admin:/usr/share/nginx/html:ro
      - ./admin.nginx.conf:/etc/nginx/conf.d/default.conf:ro
